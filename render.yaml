## Render.com Blueprint — native runtimes (no Docker).
##
## Why native (not Docker) on free tier:
##   • Build logs stream to the events panel even on failed deploys
##     — Docker free-tier hides them after failure.
##   • ~2× less memory during build, so we don't OOM.
##   • Faster cold starts.
##
## You bring (paste in the Render UI when prompted):
##   • OLLAMA_API_KEYS  — newline- or comma-separated
##   • QDRANT_URL       — from https://cloud.qdrant.io
##   • QDRANT_API_KEY   — from the same cluster
##   • AUTH_URL         — paste the cpa-web URL after first deploy
##   • INTERNAL_API_BASE — paste the cpa-api URL after first deploy
##
## See deploy/render.md for the click-by-click guide.

services:
  # ──────────────── api (native Python) ────────────────
  - type: web
    name: cpa-api
    runtime: python
    plan: free
    region: oregon
    pythonVersion: "3.12"
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install .
    startCommand: |
      set -e
      for i in 1 2 3 4 5; do
        alembic upgrade head && break
        echo "alembic retry $i — waiting before retry"
        sleep $((i*3))
      done
      exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cpa-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: OLLAMA_API_KEYS
        sync: false
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_MODEL
        value: gpt-oss:120b
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: CPA_VECTOR_BACKEND
        value: qdrant
      - key: CPA_EMBED_BACKEND
        value: hash
      - key: CPA_LLM_BACKEND
        value: ollama
      - key: CPA_AGENT_BACKEND
        value: llamaindex
      - key: CPA_S3_BACKEND
        value: memory
      - key: CPA_EMAIL_SINK
        value: memory
      - key: LOG_LEVEL
        value: INFO
      - key: CPA_LOG_FORMAT
        value: json
      - key: OTEL_TRACES_SAMPLER_ARG
        value: "0.1"

  # ──────────────── web (native Node) ────────────────
  - type: web
    name: cpa-web
    runtime: node
    plan: free
    region: oregon
    nodeVersion: "22"
    rootDir: web
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_URL
        sync: false
      - key: INTERNAL_API_BASE
        sync: false
      - key: NEXT_PUBLIC_API_BASE
        value: /api
      - key: NODE_ENV
        value: production

databases:
  - name: cpa-db
    plan: free
    databaseName: cpa
    user: cpa
    postgresMajorVersion: "16"
