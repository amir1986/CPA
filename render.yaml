## Render.com Blueprint — minimal, defensive form.
##
## Native Python + Node runtimes (no Docker) so build logs stream
## to the events panel even on failed deploys, and so the install
## fits 512 MB free-tier memory.
##
## You bring (paste in the Render UI when prompted):
##   • OLLAMA_API_KEYS    newline- or comma-separated
##   • QDRANT_URL         from https://cloud.qdrant.io
##   • QDRANT_API_KEY     from the same cluster
##   • AUTH_URL           paste the cpa-web URL after first deploy
##   • INTERNAL_API_BASE  paste the cpa-api URL after first deploy

services:
  - type: web
    name: cpa-api
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install .
    # `python -m alembic` / `python -m uvicorn` avoid depending on
    # Render putting the venv's bin/ on PATH (which silently failed —
    # `alembic upgrade head` was returning 127 with no stderr).
    # `&&` so alembic failure crashes the deploy loudly instead of
    # starting uvicorn against an empty schema. Diagnostic echoes
    # tell us which step we're at when the next deploy log is read.
    startCommand: |
      bash -c '
        exec 2>&1
        set -e
        echo "[start] pwd=$(pwd)"
        echo "[start] python=$(command -v python || echo MISSING)"
        echo "[start] alembic.ini exists? $(test -f alembic.ini && echo yes || echo NO)"
        echo "[start] alembic module check:"
        python -c "import alembic, sys; print(f\"  alembic={alembic.__version__} python={sys.version}\")"
        echo "[start] DATABASE_URL host=${DATABASE_URL%@*}@..."
        echo "[start] running migrations..."
        python -m alembic upgrade head
        echo "[start] migrations done; starting uvicorn on :${PORT:-10000}"
        exec python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}
      '
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cpa-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: OLLAMA_API_KEYS
        sync: false
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      # OLLAMA_MODEL / OLLAMA_RAG_MODEL are intentionally hardcoded in
      # app/config.py (not env vars) so a stray value can't override them.
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: CPA_VECTOR_BACKEND
        value: qdrant
      - key: CPA_EMBED_BACKEND
        value: hash
      - key: CPA_LLM_BACKEND
        value: ollama
      - key: CPA_AGENT_BACKEND
        value: simple
      - key: CPA_S3_BACKEND
        value: memory
      - key: CPA_EMAIL_SINK
        value: memory
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: cpa-web
    env: node
    plan: free
    rootDir: web
    # corepack ships with Node 22 — faster than `npm install -g pnpm`.
    # --frozen-lockfile uses pnpm-lock.yaml directly (no resolution step)
    # so the install step takes ~30 s instead of ~90 s.
    buildCommand: |
      corepack enable
      corepack prepare pnpm@10.33.0 --activate
      pnpm install --frozen-lockfile
      pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # V8 heap capped well below the 512 MB cgroup limit so total
      # process memory (heap + native + libuv) stays under the kill
      # threshold during `next build`'s peak.
      - key: NODE_OPTIONS
        value: "--max-old-space-size=380 --max-semi-space-size=32"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_URL
        sync: false
      - key: INTERNAL_API_BASE
        sync: false
      - key: NEXT_PUBLIC_API_BASE
        value: /api
      - key: NODE_ENV
        value: production

databases:
  - name: cpa-db
    plan: free
    databaseName: cpa
    user: cpa
