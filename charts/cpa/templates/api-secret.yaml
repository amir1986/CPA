{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cpa.fullname" . }}-api
  labels:
    {{- include "cpa.labels" . | nindent 4 }}
type: Opaque
stringData:
  OLLAMA_API_KEYS: {{ .Values.secrets.ollamaApiKeys | quote }}
  OLLAMA_BASE_URL: "https://ollama.com"
  OLLAMA_MODEL: "qwen3.5:cloud"
  JWT_SECRET: {{ default (randAlphaNum 48) .Values.secrets.jwtSecret | quote }}
  ADMIN_API_KEY: {{ default (randAlphaNum 32) .Values.secrets.adminApiKey | quote }}
  {{- with .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ . | quote }}
  {{- else }}
  DATABASE_URL: "postgresql+asyncpg://cpa:cpa@{{ include "cpa.fullname" . }}-postgres:5432/cpa"
  {{- end }}
  QDRANT_URL: "http://{{ include "cpa.fullname" . }}-qdrant:6333"
  S3_ENDPOINT_URL: {{ default (printf "http://%s-minio:9000" (include "cpa.fullname" .)) .Values.secrets.s3.endpoint | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.s3.accessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.s3.secretKey | quote }}
  S3_BUCKET: {{ .Values.secrets.s3.bucket | quote }}
  SMTP_HOST: {{ .Values.secrets.smtp.host | quote }}
  SMTP_PORT: {{ .Values.secrets.smtp.port | quote }}
  SMTP_USERNAME: {{ .Values.secrets.smtp.username | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.smtp.password | quote }}
  SMTP_FROM: {{ .Values.secrets.smtp.from | quote }}
{{- end }}
