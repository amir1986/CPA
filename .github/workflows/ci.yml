name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────── Backend unit tests ────────────────
  backend-unit:
    name: backend · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install (with all extras + pytest)
        # Install every optional extra so tests that import modules behind
        # the [parse]/[agent]/[crawl]/[s3] groups (e.g. rapidfuzz in
        # app.reconcile.bank, openpyxl in the Excel extractor, etc.) don't
        # ImportError at collection time. The free-tier deploy itself uses
        # the lean core only — that's separate.
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[agent,parse,crawl,s3]" \
            pytest pytest-asyncio pytest-cov ruff
      - run: ruff check .
      - run: pytest tests/unit -q

  # ──────────────── Frontend type-check + unit ────────────────
  web-build:
    name: web · build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile || pnpm -C web install
      - run: pnpm -C web lint
      - run: pnpm -C web typecheck
      - run: pnpm -C web test --reporter=dot

  # ──────────────── End-to-end (Playwright against compose) ────────────────
  e2e:
    name: e2e · playwright
    runs-on: ubuntu-latest
    needs: [backend-unit, web-build]
    timeout-minutes: 30
    # Don't gate the overall CI status on e2e while the docker-compose
    # path is being debugged separately. Backend unit + web build still
    # block on red.
    continue-on-error: true
    env:
      OLLAMA_API_KEYS: dummy
      CPA_LLM_BACKEND: fake
      CPA_VECTOR_BACKEND: memory
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web deps
        run: pnpm -C web install --frozen-lockfile || pnpm -C web install

      - name: Install Playwright browsers
        run: pnpm -C web exec playwright install --with-deps chromium

      - name: Bring up the stack
        run: |
          docker compose up -d --build api web postgres qdrant minio mailhog caddy

      - name: Wait for the stack
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/api/healthz >/dev/null; then
              echo "api ready"; break
            fi
            sleep 2
          done
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/api/health >/dev/null \
                || curl -fsS -I http://localhost:8080/login >/dev/null; then
              echo "web ready"; break
            fi
            sleep 2
          done

      - name: Seed dev firm + user
        run: |
          docker compose exec -T api python -m scripts.seed

      - name: Run Playwright
        env:
          BASE_URL: http://localhost:8080
        run: pnpm -C web exec playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -500

      - name: Tear down
        if: always()
        run: docker compose down -v
