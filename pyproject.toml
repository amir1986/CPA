[project]
name = "cpa"
version = "0.1.0"
description = "CPA AI Assistant — knowledge + books + analysis + audit"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "structlog>=24.4",
    "python-json-logger>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "aioboto3>=13.0",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "aiosmtplib>=3.0",
    "email-validator>=2.2",
    "slowapi>=0.1.9",
    "tenacity>=9.0",
    "orjson>=3.10",
    "qdrant-client>=1.11",
    "llama-index-core>=0.11",
    "llama-index-embeddings-huggingface>=0.3",
    "sentence-transformers>=3.0",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "python-multipart>=0.0.9",
    "workalendar>=17.0",
    "python-bidi>=0.6",
    "trafilatura>=1.12",
    "selectolax>=0.3",
    "rapidfuzz>=3.10",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "prometheus-client>=0.20",
    "llama-index-core>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13", "pdf2image>=1.17", "Pillow>=10.4"]
pdf = ["weasyprint>=62.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "testcontainers[postgres,minio,generic]>=4.8",
    "schemathesis>=3.36",
    "pre-commit>=3.8",
    "freezegun>=1.5",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",          # pycodestyle / pyflakes
    "I",                     # isort
    "B",                     # bugbear
    "UP",                    # pyupgrade
    "SIM",                   # simplify
    "RUF",                   # ruff
]
ignore = ["E501"]            # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["workalendar.*", "trafilatura.*", "selectolax.*", "pdfplumber.*", "pdf2image.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: integration tests (require Docker)",
    "e2e: end-to-end tests (require full compose stack)",
]
