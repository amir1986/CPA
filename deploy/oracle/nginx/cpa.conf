# /etc/nginx/sites-available/cpa.conf
#
# Public ingress for the CPA app. Mirrors Render's single-host model:
#   /        -> cpa-web (Next.js) on 127.0.0.1:3000
#   /api/*   -> Next's rewrites() forwards it onward to cpa-api on 127.0.0.1:8000
#
# The api is NOT exposed publicly - only Nginx listens on 80/443. Both upstreams
# bind to 127.0.0.1 (see the systemd units).
#
# This is the HTTP-only starting point. Run certbot (see the runbook, step 6) to
# add the TLS server block + an http->https redirect; certbot edits this file in place.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # USGAAP <> IFRS uploads. The api still enforces its own per-file and
    # aggregate caps (MAX_FILE_SIZE / MAX_TOTAL_UPLOAD); this is just the edge cap.
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";

        # SSE correctness. The app already sends a 2KB preamble + 5s heartbeats
        # and sets X-Accel-Buffering:no, but Nginx must ALSO not buffer or the
        # status pills (comparison runs, file status, query stream) hang until
        # the response completes. Disabling buffering for the whole proxy is the
        # safe choice on a low-traffic single VM; the latency cost is negligible.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
